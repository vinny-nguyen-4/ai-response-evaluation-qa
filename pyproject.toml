[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evalqa"
version = "1.0.0"
description = "AI response evaluation and QA: rating rubric, reviewer agreement and calibration, QA audit, root causes and guideline revisions."
requires-python = ">=3.10"
dependencies = ["pandas>=2.2", "numpy>=1.26", "matplotlib>=3.8", "openpyxl>=3.1"]

[project.optional-dependencies]
ai = ["anthropic>=0.40"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
